<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" width="760" height="510" role="img" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
<title>With an idempotency key</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#263CFF"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4D4D4D"/></marker></defs>
<rect width="760" height="510" rx="12" fill="#FFFDF7" stroke="#C9C3B8"/>
<text x="28" y="40" font-size="15" font-weight="700" fill="#171717" letter-spacing="0.06em">WITH AN IDEMPOTENCY KEY</text>
<rect x="50" y="58" width="120" height="34" rx="6" fill="#F7F3EA" stroke="#171717"/>
<text x="110" y="80" font-size="14" font-weight="700" text-anchor="middle" fill="#171717">App</text>
<line x1="110" y1="92" x2="110" y2="440" stroke="#C9C3B8" stroke-width="2" stroke-dasharray="2 5"/>
<rect x="370" y="58" width="120" height="34" rx="6" fill="#F7F3EA" stroke="#171717"/>
<text x="430" y="80" font-size="14" font-weight="700" text-anchor="middle" fill="#171717">Server</text>
<line x1="430" y1="92" x2="430" y2="440" stroke="#C9C3B8" stroke-width="2" stroke-dasharray="2 5"/>
<line x1="110" y1="142" x2="428" y2="142" stroke="#263CFF" stroke-width="2" marker-end="url(#a)"/>
<text x="270" y="132" font-size="12.5" text-anchor="middle" fill="#171717"><tspan fill="#4D4D4D">1.</tspan> POST + Idempotency-Key: 8f14…</text>
<circle cx="452" cy="138" r="5" fill="#1F7A3A"/><text x="466" y="142" font-size="12.5" fill="#1F7A3A">charges $60 and stores the response</text>
<line x1="430" y1="204" x2="284" y2="204" stroke="#4D4D4D" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M262 196L278 212M278 196L262 212" stroke="#C62828" stroke-width="3" stroke-linecap="round"/>
<text x="358" y="194" font-size="12.5" text-anchor="middle" fill="#171717"><tspan fill="#4D4D4D">2.</tspan> 201 Created</text>
<text x="452" y="204" font-size="12.5" fill="#4D4D4D">response is lost</text>
<rect x="40" y="262" width="140" height="26" rx="13" fill="#FBE7E7"/>
<text x="110" y="280" font-size="12" text-anchor="middle" fill="#C62828">connection error</text>
<line x1="110" y1="328" x2="428" y2="328" stroke="#263CFF" stroke-width="2" marker-end="url(#a)"/>
<text x="270" y="318" font-size="12.5" text-anchor="middle" fill="#171717"><tspan fill="#4D4D4D">3.</tspan> POST + the same key 8f14…</text>
<circle cx="452" cy="324" r="5" fill="#1F7A3A"/><text x="466" y="328" font-size="12.5" fill="#1F7A3A">key already seen: no charge</text>
<line x1="430" y1="390" x2="112" y2="390" stroke="#263CFF" stroke-width="2" marker-end="url(#a)"/>
<text x="270" y="380" font-size="12.5" text-anchor="middle" fill="#171717"><tspan fill="#4D4D4D">4.</tspan> 201 Created (stored response)</text>
<rect x="28" y="456" width="704" height="32" rx="6" fill="#E6F2E9"/>
<text x="44" y="477" font-size="13" font-weight="700" fill="#1F7A3A">Result: 1 charge, $60</text>
</svg>